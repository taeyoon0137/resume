name: GitHub Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: Changesets release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout latest main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false

      - name: Enable Corepack
        run: corepack enable

      - name: Recover an unfinished GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}"

          if ! git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            exit 0
          fi

          if gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            exit 0
          fi

          gh release create "${tag}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${tag}" \
            --generate-notes
          echo "Recovered GitHub Release: ${tag}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Detect pending changesets
        id: changesets
        shell: bash
        run: |
          pending=false

          for file in .changeset/*.md; do
            if [[ ! -e "${file}" || "${file}" == ".changeset/README.md" ]]; then
              continue
            fi

            pending=true
            break
          done

          echo "pending=${pending}" >> "${GITHUB_OUTPUT}"

          if [[ "${pending}" == "false" ]]; then
            echo "No pending changesets; no new version or tag was created." >> "${GITHUB_STEP_SUMMARY}"
          fi

      - name: Install dependencies
        if: steps.changesets.outputs.pending == 'true'
        run: corepack yarn install --immutable

      - name: Validate changesets and application
        if: steps.changesets.outputs.pending == 'true'
        shell: bash
        run: |
          corepack yarn changeset status
          corepack yarn lint
          corepack yarn build
          git diff --exit-code

      - name: Create the version commit and tag
        if: steps.changesets.outputs.pending == 'true'
        id: version
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          corepack yarn changeset version
          YARN_ENABLE_IMMUTABLE_INSTALLS=false corepack yarn install --mode=update-lockfile
          corepack yarn install --immutable

          version="$(node -p "require('./package.json').version")"
          tag="v${version}"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag already exists: ${tag}" >&2
            exit 1
          fi

          allowed_paths='^(\.changeset/|CHANGELOG\.md$|package\.json$|yarn\.lock$)'
          unexpected_tracked="$(git diff --name-only | grep -Ev "${allowed_paths}" || true)"
          unexpected_untracked="$(git ls-files --others --exclude-standard | grep -Ev "${allowed_paths}" || true)"

          if [[ -n "${unexpected_tracked}" || -n "${unexpected_untracked}" ]]; then
            echo "Unexpected files were changed while creating the version commit." >&2
            echo "${unexpected_tracked}" >&2
            echo "${unexpected_untracked}" >&2
            exit 1
          fi

          git add -A -- .changeset package.json CHANGELOG.md yarn.lock

          if git diff --cached --quiet; then
            echo "Changesets did not produce version changes." >&2
            exit 1
          fi

          git commit -m "Chore: ${tag} 릴리즈"
          corepack yarn changeset git-tag

          if [[ "$(git rev-parse "${tag}^{commit}")" != "$(git rev-parse HEAD)" ]]; then
            echo "Tag does not point to the version commit: ${tag}" >&2
            exit 1
          fi

          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

      - name: Push the version commit and tag atomically
        if: steps.changesets.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          gh auth setup-git
          git push --atomic origin \
            HEAD:refs/heads/main \
            "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"

      - name: Publish the GitHub Release
        if: steps.changesets.outputs.pending == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "GitHub Release already exists: ${RELEASE_TAG}" >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          gh release create "${RELEASE_TAG}" \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --title "${RELEASE_TAG}" \
            --generate-notes
          echo "Published GitHub Release: ${RELEASE_TAG}" >> "${GITHUB_STEP_SUMMARY}"
